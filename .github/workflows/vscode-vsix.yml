name: CI and release packages

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/vscode-vsix.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'tests/**'
      - 'vscode/**'
      - 'assets/**'
      - 'Makefile'
      - 'LICENSE'
      - 'README.md'
  pull_request:
    paths:
      - '.github/workflows/vscode-vsix.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'tests/**'
      - 'vscode/**'
      - 'assets/**'
      - 'Makefile'
      - 'LICENSE'
      - 'README.md'
  workflow_dispatch:
    inputs:
      publish_open_vsx:
        description: Publish the six generated VSIX packages to Open VSX
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix vscode
      - run: npm test --prefix vscode
      - run: cargo fmt --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo package --locked

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
            archive: tar
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            archive: tar
          - runner: macos-15-intel
            target: darwin-x64
            archive: tar
          - runner: macos-15
            target: darwin-arm64
            archive: tar
          - runner: windows-2022
            target: win32-x64
            archive: zip
          - runner: windows-11-arm
            target: win32-arm64
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix vscode
      - name: Build native programs and VSIX
        run: |
          cargo build --release --bins
          npm run compile --prefix vscode
          node vscode/scripts/package.cjs ${{ matrix.target }}
          node vscode/scripts/stage-release.cjs ${{ matrix.target }}
      - name: Create tar.gz archive
        if: matrix.archive == 'tar'
        run: tar -C dist -czf dist/makedown-cli-${{ matrix.target }}.tar.gz makedown-cli-${{ matrix.target }}
      - name: Create ZIP archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path dist/makedown-cli-${{ matrix.target }} -DestinationPath dist/makedown-cli-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: makedown-${{ matrix.target }}
          path: |
            vscode/*.vsix
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-artifacts -type f -print0)
          test "${#assets[@]}" -eq 12
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --title "Makedown ${GITHUB_REF_NAME}" --generate-notes

  publish-open-vsx:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_open_vsx)
    needs: package
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-open-vsx-makedown
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Open VSX CLI
        run: npm install --global --prefix "$RUNNER_TEMP/ovsx" ovsx@1.2.0
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Validate VSIX set
        run: |
          version=$(node -p "require('./vscode/package.json').version")
          targets=(linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64)
          mapfile -d '' packages < <(find release-artifacts -type f -name '*.vsix' -print0)
          test "${#packages[@]}" -eq "${#targets[@]}"
          for target in "${targets[@]}"; do
            mapfile -t matches < <(find release-artifacts -type f -name "makedown-${target}-${version}.vsix" -print)
            test "${#matches[@]}" -eq 1
          done
      - name: Create Open VSX namespace when absent
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          test -n "$OVSX_PAT"
          status=$(curl --silent --show-error --output /tmp/open-vsx-namespace.json --write-out '%{http_code}' https://open-vsx.org/api/Moonhalf383)
          case "$status" in
            200) ;;
            404)
              set +e
              output=$("$RUNNER_TEMP/ovsx/bin/ovsx" create-namespace Moonhalf383 2>&1)
              result=$?
              set -e
              printf '%s\n' "$output"
              if test "$result" -ne 0 && ! grep --ignore-case --quiet 'already exists' <<<"$output"; then
                exit "$result"
              fi
              ;;
            *) cat /tmp/open-vsx-namespace.json; exit 1 ;;
          esac
      - name: Publish VSIX packages to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          version=$(node -p "require('./vscode/package.json').version")
          targets=(linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64)
          for target in "${targets[@]}"; do
            mapfile -t matches < <(find release-artifacts -type f -name "makedown-${target}-${version}.vsix" -print)
            test "${#matches[@]}" -eq 1
            "$RUNNER_TEMP/ovsx/bin/ovsx" publish "${matches[0]}" --skip-duplicate
          done
      - name: Verify Open VSX platforms
        run: |
          version=$(node -p "require('./vscode/package.json').version")
          targets=(linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64)
          for attempt in {1..30}; do
            missing=()
            for target in "${targets[@]}"; do
              if ! curl --fail --silent --output /dev/null "https://open-vsx.org/api/Moonhalf383/makedown/${target}/${version}"; then
                missing+=("$target")
              fi
            done
            if test "${#missing[@]}" -eq 0; then
              exit 0
            fi
            printf 'Waiting for Open VSX: %s\n' "${missing[*]}"
            sleep 10
          done
          echo 'Open VSX did not expose every target within five minutes.' >&2
          exit 1

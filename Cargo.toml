[package]
name = "makedown"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mkd"
path = "src/main.rs"

[[bin]]
name = "mkd-lsp"
path = "src/bin/mkd-lsp.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
lsp-server = "0.10"
lsp-types = "0.97"
minijinja = { version = "2", features = ["fuel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
url = "2.5"

[package]
name = "makedown-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Compile Markfile specifications into staged Markdown implementation plans"
readme = "README.md"
repository = "https://github.com/Moonhalf383/makedown"
homepage = "https://github.com/Moonhalf383/makedown"
keywords = ["markdown", "planning", "specification", "cli", "lsp"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "nvim/", "vscode/"]

[lib]
name = "makedown"
path = "src/lib.rs"

[[bin]]
name = "mkd"
path = "src/main.rs"

[[bin]]
name = "mkd-lsp"
path = "src/bin/mkd-lsp.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
lsp-server = "0.10"
lsp-types = "0.97"
minijinja = { version = "2", features = ["fuel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
url = "2.5"
